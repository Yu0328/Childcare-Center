# Every push to main tests, builds and publishes site/ to GitHub Pages — no committed snapshot.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/ --retry=2 # a couple of timing-sensitive UI/sync tests fail now and then
      - run: npm run build:web
      # Static pages that must stay at their public URLs (Google OAuth verification links to them).
      - run: cp about.html privacy.html google6eff89a05c604fe8.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
